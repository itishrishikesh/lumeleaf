name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libegl1-mesa-dev libgles2-mesa-dev libxcursor-dev libvulkan-dev
      - name: Build versioned native binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make build VERSION="$version" COMMIT="${GITHUB_SHA::12}" BUILD_DATE="$build_date"
          /tmp/lumeleaf --version
      - name: Package Linux release
        if: matrix.platform == 'linux'
        run: VERSION="${GITHUB_REF_NAME#v}" ARCH=${{ matrix.arch }} BINARY=/tmp/lumeleaf DIST=dist ./scripts/package-linux.sh
      - name: Package macOS release
        if: matrix.platform == 'macos'
        run: VERSION="${GITHUB_REF_NAME#v}" ARCH=${{ matrix.arch }} BINARY=/tmp/lumeleaf DIST=dist ./scripts/package-macos.sh
      - name: Validate package contents
        shell: bash
        run: |
          test -x "dist/lumeleaf-${{ matrix.platform }}-${{ matrix.arch }}"
          "dist/lumeleaf-${{ matrix.platform }}-${{ matrix.arch }}" --version
          test "$(find dist -type f | wc -l | tr -d ' ')" -ge 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lumeleaf ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
